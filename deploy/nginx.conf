server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  charset utf-8;
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/geo+json;

  # Next static export uses trailingSlash: true, so /en/ -> /en/index.html.
  location / {
    # Fall through to a named location so a miss returns a real 404 status,
    # rather than 200 with the 404 page's body.
    try_files $uri $uri/ $uri/index.html $uri.html @notfound;
  }

  location @notfound {
    return 404;
  }

  # Hashed build assets never change under the same name.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Ward geometry is refreshed by a rebuild; let it revalidate.
  location /data/ {
    add_header Cache-Control "public, max-age=3600";
    types { application/geo+json geojson; application/json json; }
    try_files $uri =404;
  }

  # HTML must revalidate: the countdown and candidate data change.
  location ~* \.html$ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  error_page 404 /404.html;
  access_log /dev/stdout;
  error_log  /dev/stderr warn;
}
